# Image of the cluster-gateway instances
image: oamdev/cluster-gateway

tag:

# Number of replicas
replicas: 1
# A secured namespace for reading cluster secrets
secretNamespace: open-cluster-management-credentials

ocmIntegration:
  enabled: false
  clusterProxy:
    enabled: false
    endpoint:
      host: proxy-entrypoint.open-cluster-management-cluster-proxy
      port: 8090

featureGate:
  healthiness: false
  secretCache: false

tls:
  autoGenerateCert: true
  # Bare secret name (not namespaced). The secret is created in secretNamespace.
  secretName: cluster-gateway-tls
