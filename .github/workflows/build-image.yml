name: BuildImage

on:
  push:
    branches:
      - master
      - release-*
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Allow manual runs only on master and release branches
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ${GITHUB_REF} != "refs/heads/master" && ${GITHUB_REF} != refs/heads/release-* ]]; then
            echo "::error::Manual runs are only allowed on master or a release-* branch, not ${GITHUB_REF}"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            oamdev/cluster-gateway
            ghcr.io/oam-dev/cluster-gateway
          # Without this, metadata-action adds `latest` for every tag (`latest=auto` with
          # `type=ref,event=tag`), so the last tag pushed on any branch moved it. `latest`
          # is set after the push instead (the last step).
          flavor: |
            latest=false
          # A branch build gets the moving `<branch>` tag and an immutable `<branch>-<sha>`
          # (a candidate that can be scanned and tested before a release is tagged).
          tags: |
            type=ref,event=branch
            type=raw,value={{branch}}-{{sha}},enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=ref,event=tag
      - name: Login docker.io
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a # v2.1.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./cmd/apiserver/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `latest` is the newest release: only a tag vX.Y.Z (no pre-release suffix) that is the
      # highest of all such tags moves it. A patch on an older line (v1.9.3 after v1.10.0) or an
      # alpha doesn't, and neither do branch pushes. The check runs after the push, so a build
      # that finishes after a newer tag was pushed doesn't move `latest` back.
      - name: Tag latest if this is the newest release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n1)
          if [[ ! ${TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || ${TAG} != "${newest}" ]]; then
            echo "Tag ${TAG}, newest release ${newest:-none}: latest not moved"
            exit 0
          fi
          while read -r ref; do
            image=${ref%:*}
            docker buildx imagetools create --tag "${image}:latest" "${image}@${DIGEST}"
            echo "${image}:latest -> ${DIGEST}"
          done <<<"${IMAGE_TAGS}"
